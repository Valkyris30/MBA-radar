<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBA Radar</title>
<meta name="description" content="Daily management reading, mapped to your MBA modules.">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MBA Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme and desk before the first paint, so the page never flashes the wrong colours.
  try {
    var t = JSON.parse(localStorage.getItem('mr.theme') || 'null');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    var d = JSON.parse(localStorage.getItem('mr.desk') || '"study"');
    document.documentElement.dataset.desk = ['study', 'maritime', 'freight'].indexOf(d) >= 0 ? d : 'study';
  } catch (e) { document.documentElement.dataset.desk = 'study'; }
</script>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity=".55"/>
        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity=".8"/>
        <path d="M12 12L12 3A9 9 0 0 1 19.8 7.5Z" fill="currentColor" fill-opacity=".45"/>
        <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
        <circle cx="16.4" cy="7.8" r="1.4" fill="currentColor"/>
      </svg>
      <div>
        <h1 id="title">MBA Radar</h1>
        <p class="brief" id="brief">Loading today's edition</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="updated" id="updated"></span>
      <button class="icon-btn theme-btn" id="theme" aria-label="Switch between light and dark">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="refresh" aria-label="Refresh edition">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <section class="radar-panel" aria-label="Module radar">
    <div class="radar-wrap" id="radarWrap">
      <div class="sweep" aria-hidden="true"></div>
      <div id="radar"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="radar-foot" id="radarFoot"></div>
  </section>

  <aside class="side">
    <div class="filters">
      <div class="row">
        <div class="seg" role="group" aria-label="Feed view">
          <button type="button" data-view="today" class="on" aria-pressed="true">Today<b></b></button>
          <button type="button" data-view="archive" aria-pressed="false">Archive<b></b></button>
          <button type="button" data-view="saved" aria-pressed="false">Saved<b></b></button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search articles" autocomplete="off" aria-label="Search articles">
        </label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by module"></div>
    </div>
    <div id="banner"></div>
    <div class="feed" id="feed"></div>
  </aside>

  <article class="detail" id="detail"></article>

  <section class="freight" id="freight" aria-label="Freight rates and sea routes">
    <div class="fr-globe"><div id="globe"></div><div class="fr-hud" id="frHud" aria-live="polite"></div></div>
    <div class="fr-panel">
      <form class="fr-form fr-card" id="frForm" onsubmit="return false"></form>
      <div class="fr-results" id="frResults"></div>
    </div>
  </section>

  <nav class="desks" aria-label="Desks">
    <button type="button" data-desk="study" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M6.5 11v4.6c0 1.3 2.5 2.9 5.5 2.9s5.5-1.6 5.5-2.9V11M21.5 9v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Study</span><b></b>
    </button>
    <button type="button" data-desk="maritime" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v13M8 10.5h8M4.5 13.5c0 3.8 3.4 6.5 7.5 6.5s7.5-2.7 7.5-6.5M3 15l1.5-1.5L6 15M18 15l1.5-1.5L21 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Maritime</span><b></b>
    </button>
    <button type="button" data-desk="freight" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h18v8.5H3zM6.5 9.5V18M10 9.5V18M14 9.5V18M17.5 9.5V18M7 9.5l2-4h6l2 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Freight</span><b></b>
    </button>
  </nav>

</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="freight.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
