<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBA Radar</title>
<meta name="description" content="Daily management reading, mapped to your MBA modules.">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MBA Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.2"/>
        <circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
        <path d="M20 20 L20 3 A17 17 0 0 1 34.7 11.5 Z" fill="currentColor" fill-opacity=".28"/>
        <circle cx="20" cy="20" r="2.4" fill="currentColor"/>
        <circle cx="28" cy="13" r="2.2" fill="#8b7cff"/>
        <circle cx="11" cy="25" r="1.8" fill="#ffb454"/>
      </svg>
      <div>
        <h1>MBA Radar</h1>
        <p class="brief" id="brief">Loading today's edition</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="refresh" aria-label="Refresh edition">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <section class="radar-panel" aria-label="Module radar">
    <div class="radar-wrap" id="radarWrap">
      <div class="sweep" aria-hidden="true"></div>
      <div id="radar"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <p class="radar-hint">Each dot is an article, pulled toward the modules it applies to. Select a module to filter.</p>
  </section>

  <aside class="side">
    <div class="filters">
      <div class="row">
        <div class="seg" role="group" aria-label="Feed view">
          <button type="button" data-view="today" class="on" aria-pressed="true">Today<b></b></button>
          <button type="button" data-view="archive" aria-pressed="false">Archive<b></b></button>
          <button type="button" data-view="saved" aria-pressed="false">Saved<b></b></button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search articles" autocomplete="off" aria-label="Search articles">
        </label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by module"></div>
    </div>
    <div id="banner"></div>
    <div class="feed" id="feed"></div>
  </aside>

  <article class="detail" id="detail"></article>

</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
